# Kitty terminal configuration

# Shell
shell .

# Include theme from theme-generator
include theme.conf

# Font settings
font_family JetBrainsMono Nerd Font
font_size 11.0

# Bell
enable_audio_bell no
visual_bell_duration 0.3
visual_bell_color #3c3836

# Cursor
cursor_shape block
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# Keep line scrolling immediate. Kitty 0.47 made the built-in J/K mappings smooth,
# which can fail to produce visible movement while an interactive TUI is active.
map ctrl+shift+k scroll_line_up
map ctrl+shift+j scroll_line_down
map ctrl+shift+u scroll_page_up
map ctrl+shift+d scroll_page_down

# Mouse
mouse_hide_wait 3.0
url_style curly

# Window
window_padding_width 4
hide_window_decorations yes
confirm_os_window_close 0

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted

# Allow remote control (for theme hot-reload)
allow_remote_control yes
listen_on unix:/tmp/kitty

# Zoom
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Scrollback -> kitty-scrollback.nvim (ANSI colors, relative line numbers, all lines)
# Runs under a minimal nvim config (ksb-minimal.lua) for instant start / no extra UI.
# Note: kitten args (--config) must come BEFORE --nvim-args, else nvim eats them.
action_alias kitty_scrollback_nvim kitten /home/martin/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
map kitty_mod+h kitty_scrollback_nvim --nvim-args -u /home/martin/.config/kitty/ksb-minimal.lua -n

# Copy previous command's output straight to the clipboard (no nvim)
map kitty_mod+g launch --type=background --stdin-source=@last_cmd_output /home/martin/.scripts/kitty-copy-last-output

mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output --nvim-args -u /home/martin/.config/kitty/ksb-minimal.lua -n

# Dedicated Herdr windows (kitty -e herdr, including an absolute binary path).
# Preserve Kitty's normal bindings elsewhere. Use send_key rather than no_op:
# no_op removes the default mapping instead of conditionally forwarding the key.
map --when-focus-on "cmdline:^herdr$ or cmdline:/herdr$" ctrl+shift+u send_key ctrl+shift+u
map --when-focus-on "cmdline:^herdr$ or cmdline:/herdr$" ctrl+shift+d send_key ctrl+shift+d
map --when-focus-on "cmdline:^herdr$ or cmdline:/herdr$" ctrl+shift+h send_key ctrl+shift+h
map --when-focus-on "cmdline:^herdr$ or cmdline:/herdr$" ctrl+shift+l send_key ctrl+shift+l
map --when-focus-on "cmdline:^herdr$ or cmdline:/herdr$" ctrl+shift+j send_key ctrl+shift+j
map --when-focus-on "cmdline:^herdr$ or cmdline:/herdr$" ctrl+shift+k send_key ctrl+shift+k
map --when-focus-on "cmdline:^herdr$ or cmdline:/herdr$" ctrl+shift+e send_key ctrl+shift+e
